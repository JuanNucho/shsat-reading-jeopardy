<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Reading Jeopardy – Tournament Edition</title>

<style>
body {
    margin:0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg,#001f4d,#0b3d91);
    color:white;
    text-align:center;
}

h1 {
    margin-top:20px;
    font-size:42px;
}

#scoreBoard {
    font-size:22px;
    margin-bottom:10px;
}

#board {
    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:10px;
    padding:20px;
    max-width:1200px;
    margin:auto;
}

.category {
    background:#001433;
    padding:15px;
    font-weight:bold;
    font-size:18px;
}

.tile {
    background:#0057b7;
    padding:30px 10px;
    font-size:28px;
    cursor:pointer;
    border-radius:8px;
    transition:0.3s;
}

.tile:hover {
    background:#0080ff;
    transform:scale(1.05);
}

.used {
    background:#222 !important;
    cursor:default;
}

.dailyReveal {
    background:gold !important;
    color:black !important;
    font-weight:bold;
}

#modal {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
}

#modalContent {
    background:white;
    color:#1f2d3d;
    width:85%;
    max-width:900px;
    padding:40px;
    border-radius:12px;
    text-align:left;
}

.choice {
    background:#e8f1ff;
    padding:12px;
    margin:10px 0;
    border-radius:6px;
    cursor:pointer;
    transition:0.2s;
}

.choice:hover { background:#cce0ff; }

.correct { background:#c8f7c5 !important; }
.incorrect { background:#ffcccc !important; }

#host {
    position:fixed;
    bottom:0;
    width:100%;
    background:#111;
    padding:15px;
    font-size:18px;
}
button {
    padding:10px 20px;
    border:none;
    background:#0b3d91;
    color:white;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>📘 Reading Jeopardy</h1>
<div id="scoreBoard">Score: $<span id="score">0</span></div>

<div id="board"></div>

<div id="modal">
<div id="modalContent">
<h2 id="questionTitle"></h2>
<p id="questionText"></p>
<div id="choices"></div>
<button onclick="closeModal()">Return to Board</button>
</div>
</div>

<div id="host">🎤 Host: Welcome to the SHSAT Reading Championship!</div>

<script>

let score = 0;

/* Hidden Daily Double Location */
let dailyDouble = {
    category: 2,
    points: 500
};

const categories = [
"Main Idea",
"Best Evidence",
"Trap Detector",
"Author’s Purpose"
];

const dollarValues = [100,200,300,400,500];

const questions = [];

function addQuestion(category, points, title, text, choices, correct, explanation){
questions.push({category, points, title, text, choices, correct, explanation});
}

/* ===== QUESTIONS ===== */

/* MAIN IDEA */
addQuestion(0,100,"Main Idea $100",
"Urban gardens improve health, reduce food insecurity, and strengthen neighborhoods.",
["Gardens are expensive","Urban gardens provide multiple benefits","Cities are crowded","Food insecurity is rare"],
1,"Balanced summary of benefits.");

addQuestion(0,200,"Main Idea $200",
"A passage compares print and digital books, explaining advantages of both.",
["E-books are better","Both formats have strengths","Books are outdated","Reading is declining"],
1,"Balanced comparison.");

addQuestion(0,300,"Main Idea $300",
"The author discusses challenges and solutions for renewable energy adoption.",
["Energy is difficult","Renewables face obstacles but offer solutions","Fossil fuels are better","Solar panels are popular"],
1,"Includes challenge + solution.");

addQuestion(0,400,"Main Idea $400",
"A scientist explains how climate change affects oceans and wildlife ecosystems.",
["Oceans are large","Climate change impacts marine ecosystems","Wildlife is interesting","Scientists study oceans"],
1,"Central theme is impact.");

addQuestion(0,500,"Main Idea $500",
"The passage argues technology can improve learning but must be used thoughtfully.",
["Technology is harmful","Technology always improves learning","Technology helps when used wisely","Schools should ban devices"],
2,"Includes condition and balance.");

/* BEST EVIDENCE */
addQuestion(1,100,"Evidence $100",
"Author claims exercise improves mental health.",
["Gyms are popular","Studies show reduced anxiety","Exercise is hard","People enjoy sports"],
1,"Direct research support.");

addQuestion(1,200,"Evidence $200",
"Claim: Renewable energy reduces pollution.",
["Solar panels reduce emissions","Windmills are tall","Energy costs money","Energy is important"],
0,"Direct support.");

addQuestion(1,300,"Evidence $300",
"Claim: Reading fiction builds empathy.",
["Stories are fun","Research links fiction to empathy","Books are popular","Libraries exist"],
1,"Scientific support.");

addQuestion(1,400,"Evidence $400",
"Claim: Urban parks improve community well-being.",
["Parks are green","Community surveys show improved mood","Cities are busy","Trees are tall"],
1,"Evidence through data.");

addQuestion(1,500,"Evidence $500",
"Claim: Sleep improves academic performance.",
["Students like sleep","Studies show higher grades with sleep","Sleep feels good","Schools start early"],
1,"Strongest support.");

/* TRAP DETECTOR */
addQuestion(2,100,"Trap $100",
"Which is extreme language?",
["Sometimes improves","Always improves","Often helps","May improve"],
1,"Always = extreme.");

addQuestion(2,200,"Trap $200",
"Character left because angry and confused. Half-true?",
["He was angry","He was angry and confused","He was confused","He left"],
0,"Leaves out confused.");

addQuestion(2,300,"Trap $300",
"Question asks cost of notebooks only but includes pencil price. Trap?",
["Include pencil","Ignore pencil","Add everything","Guess"],
1,"Ignore extra info.");

addQuestion(2,400,"Trap $400",
"Which answer overgeneralizes?",
["Some students struggle","All students struggle","Many students struggle","Several struggle"],
1,"All = overgeneralized.");

addQuestion(2,500,"Trap $500",
"Which answer misrepresents author tone?",
["Balanced view","Extreme claim not stated","Qualified statement","Moderate summary"],
1,"Exaggeration trap.");

/* AUTHOR PURPOSE */
addQuestion(3,100,"Purpose $100",
"Explains volcano formation.",
["Persuade","Inform","Entertain","Criticize"],
1,"Informational.");

addQuestion(3,200,"Purpose $200",
"Argues schools should start later.",
["Entertain","Persuade","Describe","Narrate"],
1,"Argument.");

addQuestion(3,300,"Purpose $300",
"Describes a historical event with facts.",
["Inform","Convince","Entertain","Scold"],
0,"Factual.");

addQuestion(3,400,"Purpose $400",
"Uses humor to tell a story.",
["Inform","Persuade","Entertain","Explain"],
2,"Humor.");

addQuestion(3,500,"Purpose $500",
"Warns readers about dangers of misinformation.",
["Entertain","Persuade","Describe","Compare"],
1,"Warning = persuasion.");

/* ===== BUILD BOARD ===== */

let board=document.getElementById("board");

categories.forEach(cat=>{
let div=document.createElement("div");
div.className="category";
div.innerText=cat;
board.appendChild(div);
});

dollarValues.forEach(points=>{
categories.forEach((cat,i)=>{
let q=questions.find(q=>q.category===i && q.points===points);
let tile=document.createElement("div");
tile.className="tile";
tile.innerText="$"+points;
tile.onclick=()=>openQuestion(q,tile);
board.appendChild(tile);
});
});

/* ===== GAME LOGIC ===== */

function openQuestion(q,tile){

if(tile.classList.contains("used")) return;
tile.classList.add("used");

document.getElementById("modal").style.display="flex";
document.getElementById("questionTitle").innerText=q.title;
document.getElementById("questionText").innerText=q.text;

let choicesDiv=document.getElementById("choices");
choicesDiv.innerHTML="";

/* DAILY DOUBLE REVEAL */
if(q.category===dailyDouble.category && q.points===dailyDouble.points){
    updateHost("🎉 DAILY DOUBLE!!! You control the board!");
    tile.classList.add("dailyReveal");
}

q.choices.forEach((choice,index)=>{
let div=document.createElement("div");
div.className="choice";
div.innerText=choice;

div.onclick=()=>{
if(index===q.correct){
div.classList.add("correct");
score+=q.points;
updateHost("🎤 Excellent! "+q.explanation);
}else{
div.classList.add("incorrect");
score-=q.points;
updateHost("🎤 Not quite. "+q.explanation);
}
document.getElementById("score").innerText=score;
};
choicesDiv.appendChild(div);
});
}

function closeModal(){
document.getElementById("modal").style.display="none";
updateHost("🎤 Select the next challenge!");
}

function updateHost(text){
document.getElementById("host").innerText=text;
}

</script>
</body>
</html>
